<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DesignShelf Data Integrity Test</title><style>body{font-family:system-ui;max-width:860px;margin:auto;padding:32px 18px;background:#f6f7f9;color:#17191d}.row,.summary{background:#fff;border:1px solid #dfe4ea;border-radius:14px;padding:14px 16px;margin:8px 0}.ok{border-color:#8fd0a7}.ng{border-color:#ef9a9a}small{color:#68707b}</style></head><body><p><a href="../index.html">← DesignShelfへ戻る</a></p><h1>データ整合テスト</h1><p>GitHub Pages上で正式JSONを直接読みます。</p><div class="summary" id="summary">確認中...</div><div id="results"></div><script type="module">const checks=[],add=(ok,label,detail)=>checks.push({ok,label,detail});try{const manifest=await fetch('../data/palettes.json',{cache:'no-store'}).then(r=>r.json());const palettes=(await Promise.all(manifest.files.map(f=>fetch('../'+f,{cache:'no-store'}).then(r=>r.json())))).flat();const layouts=await fetch('../data/layouts.json',{cache:'no-store'}).then(r=>r.json());add(palettes.length===100,'配色件数',`${palettes.length} / 100`);add(layouts.length===24,'骨格件数',`${layouts.length} / 24`);add(new Set(palettes.map(x=>x.id)).size===100,'配色ID','重複なし');add(new Set(layouts.map(x=>x.wireframe)).size===24,'wireframe','24骨格が固有');add(!palettes.some(p=>!Object.values(p.colors).every(c=>/^#[0-9a-f]{6}$/i.test(c))),'カラーコード','6桁HEX')}catch(err){add(false,'JSON読み込み',String(err.message||err))}const failed=checks.filter(x=>!x.ok).length;document.getElementById('summary').textContent=failed?`${failed}件の要確認`:'すべて合格';document.getElementById('results').innerHTML=checks.map(x=>`<div class="row ${x.ok?'ok':'ng'}"><strong>${x.ok?'✓':'!'} ${x.label}</strong><br><small>${x.detail}</small></div>`).join('')</script></body></html>
