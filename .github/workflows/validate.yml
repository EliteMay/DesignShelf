name: Validate DesignShelf

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    uses: EliteMay/.github/.github/workflows/reusable-web-baseline.yml@47f58bc690cda0f3aea21c0e65af164a9d6cffdd
    with:
      node-version: '22'
      syntax-paths: 'js scripts'
      check-json: true

  project:
    needs: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate data and local references
        run: node scripts/validate-data.mjs
